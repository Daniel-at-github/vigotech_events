name: Fetch Calendar Events

on:
  schedule:
    - cron: "0 16 * * *" # Run daily at 16:00 UTC
  workflow_dispatch:

permissions:
  contents: write # Allows the workflow to push commits to the repo

jobs:
  update-calendars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Run Mobilizon fetch script
        run: uv run etl/fetch_mobilizon.py

      - name: Run Meetup fetch script
        run: uv run etl/fetch_meetup.py

      - name: Convert JSON to ICS
        run: uv run etl/json_to_ics.py

      - name: Generate Website
        run: uv run --with jinja2 etl/generate_website.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add JSON, ICS, and the generated Index
          git add calendars/*.json calendars/*.ics index.html

          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update calendar data and website [skip ci]"
            git push
          fi
